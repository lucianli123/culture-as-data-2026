<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">Documents as points in a space of word counts</title>
<desc id="d">Six documents plotted by how often two words appear; sea sentences and kitchen sentences land in different regions, and the angle between two vectors is their similarity.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B63"/></marker></defs>
<text x="28" y="36" font-size="12" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="2">EVERY DOCUMENT IS A POINT</text>
<line x1="210.0" y1="66" x2="210.0" y2="376" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="314.0" x2="570" y2="314.0" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="300.0" y1="66" x2="300.0" y2="376" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="252.0" x2="570" y2="252.0" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="390.0" y1="66" x2="390.0" y2="376" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="190.0" x2="570" y2="190.0" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="480.0" y1="66" x2="480.0" y2="376" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="128.0" x2="570" y2="128.0" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="570.0" y1="66" x2="570.0" y2="376" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="66.0" x2="570" y2="66.0" stroke="#D9D4CC" stroke-width="1" stroke-linecap="round"/>
<line x1="120" y1="376" x2="570" y2="376" stroke="#6B6B63" stroke-width="1.5" stroke-linecap="round"/>
<line x1="120" y1="66" x2="120" y2="376" stroke="#6B6B63" stroke-width="1.5" stroke-linecap="round"/>
<text x="345.0" y="414" font-size="13" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">how many times “tide” appears  →</text>
<g transform="translate(74,221.0) rotate(-90)"><text x="0" y="0" font-size="13" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">how many times “butter” appears  →</text></g>
<line x1="120" y1="376" x2="390.0" y2="314.0" stroke="#A34526" stroke-width="1.8" opacity="0.5"/>
<line x1="120" y1="376" x2="192.0" y2="177.6" stroke="#1F5FA8" stroke-width="1.8" opacity="0.5"/>
<path d="M 214.5 354.3 A 105 105 0 0 0 145.2 306.56" fill="none" stroke="#6B6B63" stroke-width="1.4" stroke-dasharray="3 3"/>
<circle cx="390.0" cy="314.0" r="7.5" fill="#A34526" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="488.99999999999994" cy="283.0" r="7.5" fill="#A34526" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="327.0" cy="338.8" r="7.5" fill="#A34526" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="192.0" cy="177.6" r="7.5" fill="#1F5FA8" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="255.0" cy="109.40000000000003" r="7.5" fill="#1F5FA8" stroke="#FFFFFF" stroke-width="1.2"/>
<circle cx="183.0" cy="221.0" r="7.5" fill="#1F5FA8" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="394.0" y="340.0" font-size="12.5" fill="#A34526" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="italic">“the tide came in…”</text>
<text x="271.0" y="113.40000000000003" font-size="12.5" fill="#1F5FA8" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="italic">“he chopped onions…”</text>
<text x="241.5" y="230.29999999999998" font-size="11.5" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">the angle between two vectors</text>
<text x="241.5" y="243.94" font-size="11.5" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">is how alike their wording is</text>
<rect x="596" y="66" width="178" height="124" rx="8" fill="#F4EEE8" stroke="none" stroke-width="1"/>
<text x="614" y="96" font-size="12.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="bold" font-style="normal">two words here.</text>
<text x="614" y="120" font-size="12.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">a real corpus has</text>
<text x="614" y="138" font-size="12.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">thousands of axes,</text>
<text x="614" y="156" font-size="12.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">one per word — the</text>
<text x="614" y="174" font-size="12.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">arithmetic is the same.</text>
<text x="28" y="470" font-size="14" fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="italic">Near each other means worded alike, not “about the same thing”. Closing that gap is the whole argument of Week 5.</text>
</svg>
