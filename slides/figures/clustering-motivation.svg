<text x="28" y="594" font-size="14" fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="italic">Classification can only answer the question you brought. Clustering can hand you one you didn’t think to ask — which is why the course goes there next.</text>
