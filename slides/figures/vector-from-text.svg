<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 246" width="960" height="246" role="img" aria-labelledby="t d" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title id="t">A document becomes a row of word counts</title>
<desc id="d">The sentence 'the tide came in over the cold sand' is turned into a row of counts, one column per word in the corpus vocabulary, mostly zeros.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B6B63"/></marker></defs>
<text x="28" y="40" font-size="12" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="bold" font-style="normal" letter-spacing="2">ONE DOCUMENT, ONE ROW OF NUMBERS</text>
<rect x="28" y="62" width="300" height="78" rx="8" fill="#F4EEE8" stroke="none" stroke-width="1"/>
<text x="44" y="96" font-size="17" fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="normal">“the tide came in over</text>
<text x="44" y="120" font-size="17" fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="normal">the cold sand”</text>
<text x="28" y="162" font-size="12" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">a comment, a sentence, a novel — one item of your corpus</text>
<line x1="346" y1="100" x2="396" y2="100" stroke="#6B6B63" stroke-width="1.6" marker-end="url(#a)"/>
<text x="371" y="84" font-size="11" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">count</text>
<rect x="416" y="62" width="46" height="78" rx="6" fill="#FFFFFF" stroke="#D9D4CC" stroke-width="1"/>
<text x="439.0" y="88" font-size="10.5" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">butter</text>
<text x="439.0" y="122" font-size="20" fill="#D9D4CC" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<rect x="468" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="491.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">came</text>
<text x="491.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="520" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="543.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">cold</text>
<text x="543.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="572" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="595.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">in</text>
<text x="595.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="624" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="647.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">over</text>
<text x="647.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="676" y="62" width="46" height="78" rx="6" fill="#FFFFFF" stroke="#D9D4CC" stroke-width="1"/>
<text x="699.0" y="88" font-size="10.5" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">pasta</text>
<text x="699.0" y="122" font-size="20" fill="#D9D4CC" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">0</text>
<rect x="728" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="751.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">sand</text>
<text x="751.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="780" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="803.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">the</text>
<text x="803.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<rect x="832" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="855.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">tide</text>
<text x="855.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<rect x="884" y="62" width="46" height="78" rx="6" fill="#F4EEE8" stroke="#D9D4CC" stroke-width="1"/>
<text x="907.0" y="88" font-size="10.5" fill="#1A1A1A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle" font-weight="normal" font-style="normal">…</text>
<text x="907.0" y="122" font-size="20" fill="#A34526" font-family="'SF Mono', 'Courier New', monospace" text-anchor="middle" font-weight="bold" font-style="normal"></text>
<text x="416" y="162" font-size="12" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">one column per word in the whole corpus — thousands of them —</text>
<text x="416" y="180" font-size="12" fill="#6B6B63" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="start" font-weight="normal" font-style="normal">and for any single document, nearly all of them are zero</text>
<text x="28" y="218" font-size="15" fill="#1A1A1A" font-family="Georgia, 'Times New Roman', serif" text-anchor="start" font-weight="normal" font-style="italic">The model never sees the sentence. It sees this row.</text>
</svg>
